{% extends 'edu/base.html' %}

{% block content %}
<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to selection
    </a>

    <div class="bg-card border border-border rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-secondary flex items-center justify-center mx-auto mb-3">
          <i data-lucide="graduation-cap" class="text-secondary-foreground"></i>
        </div>
        <h2 class="font-display text-2xl font-bold">Sign In</h2>
        <p class="text-sm text-muted-foreground mt-1">Tertiary Institution Portal</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium mb-1.5">School Code</label>
          <input
            type="text"
            name="school_code"
            placeholder="e.g. CSU"
            class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1.5">User ID, Email, or Phone</label>
          <input
            type="text"
            name="username"
            placeholder="e.g. CSU/2026/001 or admin@email.com"
            class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1.5">Password</label>
          <input
            type="password"
            name="password"
            class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring"
            required
          />
        </div>

        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-secondary text-secondary-foreground px-4 py-2.5 text-sm font-medium hover:bg-secondary/90 transition-colors">
          <i data-lucide="log-in" class="w-4 h-4"></i> Sign In
        </button>
      </form>

      <div class="mt-4 text-sm text-muted-foreground">
        New institution? <a href="/edu/tertiary/register/" class="text-secondary hover:underline">Register your school</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
