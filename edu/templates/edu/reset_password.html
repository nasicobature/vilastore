{% extends 'edu/base.html' %}

{% block content %}
<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="bg-card border border-border rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center mx-auto mb-3">
          <i data-lucide="lock-keyhole" class="text-primary-foreground"></i>
        </div>
        <h2 class="font-display text-2xl font-bold">Reset Password</h2>
        <p class="text-sm text-muted-foreground mt-1">Create a new secure password for {{ profile.user.email }}.</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium mb-1.5">New Password</label>
          <input type="password" name="password" minlength="8" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" minlength="8" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium hover:bg-primary/90 transition-colors">
          <i data-lucide="check-circle" class="w-4 h-4"></i> Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
