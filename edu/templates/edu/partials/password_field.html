<div class="relative">
  <input id="{{ field_id }}" type="password" name="{{ field_name }}" autocomplete="{{ autocomplete|default:'current-password' }}" {% if minlength %}minlength="{{ minlength }}"{% endif %} required
    class="w-full h-12 pl-4 pr-12 rounded-xl border border-input bg-card text-[15px] focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} />
  <button type="button" data-toggle-password="{{ field_id }}" aria-label="Show password" class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-muted-foreground hover:text-foreground">
    <i data-eye-open data-lucide="eye" class="w-5 h-5"></i>
    <i data-eye-closed data-lucide="eye-off" class="w-5 h-5 hidden"></i>
  </button>
</div>
