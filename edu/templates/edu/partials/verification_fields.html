<div class="section-heading">
  <h2>Documents</h2>
  <p>Add simple portal branding files now. Legal documents are not required during registration.</p>
</div>

<div class="document-rules">
  <div><strong>Optional:</strong> Upload a school logo and browser favicon to personalize the portal.</div>
  <div><strong>Allowed files:</strong> PNG, JPG, JPEG, SVG, or ICO.</div>
</div>

<div class="upload-grid">
  <label class="upload-card">
    <span class="upload-icon"><i data-lucide="image"></i></span>
    <strong>School Logo <em>Optional</em></strong>
    <small>Shown in the portal header and school profile.</small>
    <input type="file" name="logo" accept=".png,.jpg,.jpeg,.svg" data-review-label="School Logo" />
  </label>

  <label class="upload-card">
    <span class="upload-icon"><i data-lucide="badge"></i></span>
    <strong>Favicon <em>Optional</em></strong>
    <small>Used as the small browser tab icon.</small>
    <input type="file" name="favicon" accept=".png,.jpg,.jpeg,.ico,.svg" data-review-label="Favicon" />
  </label>
</div>
