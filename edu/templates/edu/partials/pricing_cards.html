<div class="edu-pricing-panel" data-edu-pricing data-pricing-mode="{{ pricing_mode|default:'public' }}">
  <div class="pricing-heading">
    <div>
      <h2>Simple Pricing. Built for Schools.</h2>
      <p>Choose a plan based on the number of students in your school. Start with a 3-day free trial.</p>
    </div>
  </div>

  <div class="registration-billing-toggle edu-pricing-toggle" role="radiogroup" aria-label="Billing period">
    <label class="billing-toggle-option">
      <input type="radio" name="{{ billing_input_name|default:'pricing_billing_cycle' }}" value="termly" data-billing-cycle {% if selected_billing_cycle|default:default_subscription_cycle != 'session' %}checked{% endif %} />
      <span>Per Term</span>
    </label>
    <label class="billing-toggle-option">
      <input type="radio" name="{{ billing_input_name|default:'pricing_billing_cycle' }}" value="session" data-billing-cycle {% if selected_billing_cycle|default:default_subscription_cycle == 'session' %}checked{% endif %} />
      <span>Per Session</span>
      <em>Save 10%</em>
    </label>
  </div>

  <div class="edu-pricing-card-grid">
    {% for package in pricing_packages %}
      <label
        class="edu-package-card {% if package.code == selected_package_code|default:default_subscription_package %}is-selected{% endif %}"
        data-package-card
        data-package-code="{{ package.code }}"
        data-term-price="NGN {{ package.term_amount_display }}"
        data-session-price="NGN {{ package.session_amount_display }}"
      >
        {% if pricing_mode == 'registration' or pricing_mode == 'payment' %}
          <input
            type="radio"
            name="subscription_package"
            value="{{ package.code }}"
            required
            data-review-label="Selected Package"
            data-package-option
            data-package-name="{{ package.name }}"
            data-student-limit="{{ package.student_limit }}"
            data-student-range="{{ package.student_range }}"
            data-term-price="NGN {{ package.term_amount_display }}"
            data-session-price="NGN {{ package.session_amount_display }}"
            data-term-amount="{{ package.term_amount|floatformat:0 }}"
            data-session-amount="{{ package.session_amount|floatformat:0 }}"
            {% if package.code == selected_package_code|default:default_subscription_package %}checked{% endif %}
          />
        {% endif %}
        <span class="package-check" aria-hidden="true"><i data-lucide="check"></i></span>
        <span class="package-name">{{ package.name }}</span>
        <span class="package-range">{{ package.student_range }}</span>
        <strong class="package-price" data-package-price>NGN {{ package.term_amount_display }}</strong>
        <span class="package-cycle" data-package-billing-label>per term</span>
        <span class="package-meta"><i data-lucide="users"></i>{% if package.is_unlimited %}Unlimited students above 750{% else %}Up to {{ package.student_limit }} students{% endif %}</span>
        <span class="package-meta"><i data-lucide="badge-check"></i>3-day free trial included</span>
        {% if pricing_mode == 'registration' or pricing_mode == 'payment' %}
          <span class="package-select-button" data-package-select-text>Select Package</span>
        {% else %}
          <a
            class="package-select-button"
            data-package-cta
            href="/edu/register/?package={{ package.code }}&billing={{ selected_billing_cycle|default:default_subscription_cycle }}"
          >Start 3-Day Free Trial</a>
        {% endif %}
      </label>
    {% endfor %}
  </div>
</div>
