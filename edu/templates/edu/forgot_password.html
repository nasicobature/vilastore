{% extends 'edu/auth_base.html' %}

{% block top_link %}<a href="{{ login_url }}" class="font-medium text-primary hover:underline">Back to sign in</a>{% endblock %}

{% block form_card %}
<div>
  <span class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center"><i data-lucide="key-round" class="w-6 h-6"></i></span>
  <h1 class="font-display text-3xl font-bold mt-5">Forgot your password?</h1>
  <p class="text-muted-foreground mt-2">Enter your email or ID and we'll send you a link to set a new one.</p>
</div>

<form method="post" class="mt-8 space-y-5" novalidate>
  {% csrf_token %}
  <div>
    <label for="forgot-identifier" class="block text-sm font-semibold mb-2">Email or ID</label>
    <input id="forgot-identifier" type="text" name="identifier" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus
      placeholder="you@school.com or your ID"
      class="w-full h-12 px-4 rounded-xl border border-input bg-card text-[15px] focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
  </div>
  <button type="submit" data-submit-label="Sending…" class="w-full h-12 inline-flex items-center justify-center gap-2 rounded-xl bg-primary text-primary-foreground font-semibold hover:bg-primary/90 disabled:opacity-70 transition">
    <span data-submit-text>Send reset link</span>
    <i data-lucide="send" class="w-4 h-4"></i>
  </button>
</form>

<p class="mt-6 text-sm text-muted-foreground">No email? Your school admin can also reset your password for you.</p>
{% endblock %}
