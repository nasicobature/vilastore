{% extends 'edu/base.html' %}

{% block content %}
<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <a href="{{ login_url }}" class="flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to login
    </a>

    <div class="bg-card border border-border rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center mx-auto mb-3">
          <i data-lucide="key-round" class="text-primary-foreground"></i>
        </div>
        <h2 class="font-display text-2xl font-bold">Forgot Password</h2>
        <p class="text-sm text-muted-foreground mt-1">Enter your school code and account email or user ID.</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="institution_type" value="{{ institution_type }}" />
        <div>
          <label class="block text-sm font-medium mb-1.5">School Code</label>
          <input type="text" name="school_code" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Email or User ID</label>
          <input type="text" name="identifier" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
        </div>
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium hover:bg-primary/90 transition-colors">
          <i data-lucide="send" class="w-4 h-4"></i> Send Reset Link
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
