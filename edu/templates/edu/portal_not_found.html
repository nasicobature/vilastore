{% extends 'edu/base.html' %}

    <div class="w-14 h-14 rounded-2xl bg-muted flex items-center justify-center mx-auto mb-4">
      <i data-lucide="school" class="w-7 h-7 text-muted-foreground"></i>
    </div>
    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">School Portal</p>

    </p>
    <a href="https://vilastore.store/edu/" class="mt-6 inline-flex items-center justify-center rounded-lg bg-primary text-primary-foreground px-5 py-3 text-sm font-semibold hover:bg-primary/90">

  </div>
