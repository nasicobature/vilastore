{% extends 'edu/base.html' %}

{% block content %}
<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-2xl">
    <a href="/edu/secondary/{{ request.user.profile.role }}/" class="flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to dashboard
    </a>

    <div class="bg-card border border-border rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center mx-auto mb-3">
          <i data-lucide="users" class="text-primary-foreground"></i>
        </div>
        <h2 class="font-display text-2xl font-bold">Admin User Creation</h2>
        <p class="text-sm text-muted-foreground mt-1">Create accounts for your school roles.</p>
      </div>

      <form method="post" action="/edu/secondary/users/create/" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Full Name *</label>
            <input type="text" name="full_name" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">User ID (auto)</label>
            <div class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm text-muted-foreground">Generated after submit</div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Email *</label>
            <input type="email" name="email" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Password *</label>
            <input type="password" name="password" required class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Role *</label>
            <select name="role" class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring">
              {% for opt in role_options %}
                <option value="{{ opt.slug }}">{{ opt.label }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Class (students)</label>
            <select name="academic_class" class="w-full px-3 py-2.5 rounded-lg border border-input bg-background text-sm focus:outline-none focus:ring-2 focus:ring-ring">
              <option value="">Select Class</option>
              {% for cls in classes %}
                <option value="{{ cls.id }}">{{ cls.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-primary text-primary-foreground px-4 py-2.5 text-sm font-medium hover:bg-primary/90 transition-colors">
          Create Account
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
