services:
  - type: web
    name: vilastore
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m gunicorn VilaStore.wsgi:application
    envVars:
    disk:
      name: vilastore-media
      mountPath: /var/data
      sizeGB: 1
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: vilastore-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: vilastore.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
databases:
  - name: vilastore-db
