{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VilaStore - Agent Login</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-branding">
      <div class="auth-branding-content">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <i data-lucide="users"></i>
          </div>
          <h1>VilaStore</h1>
        </div>
        <h2>Agent Portal</h2>
        <p>Track the shops you invited and your monthly commission.</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-container">
        <div class="auth-form-header">
          <h2>Sign In</h2>
          <p>Agent access only</p>
        </div>

        {% if messages %}
        <div style="margin-bottom:1rem;">
          {% for message in messages %}
          <div class="card" style="padding:0.75rem 1rem;">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'agent_login' %}" class="auth-form">
          {% csrf_token %}
          <div class="form-group">
            <label>Username or Email</label>
            <div class="input-with-icon">
              <i data-lucide="user"></i>
              <input type="text" name="identifier" class="input" placeholder="agentname or email" required>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-with-icon">
              <i data-lucide="lock"></i>
              <input type="password" name="password" class="input" placeholder="********" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-full">Sign In</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () { lucide.createIcons(); });
  </script>
</body>
</html>
